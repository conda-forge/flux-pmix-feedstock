schema_version: 1

context:
  name: flux-pmix
  version: "0.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/flux-framework/flux-pmix/releases/download/v${{ version }}/flux-pmix-${{ version }}.tar.gz
  sha256: b8aac606b91f141e68bd1cc086cb0fecb1e318f1e92d5c4aa7402847f4beceb2

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - make
    - pkg-config
  host:
    - flux-core
    - ${{ mpi }}
    - jansson
    - libpmix
    - libpmix-devel
  run:
    - flux-core
    - ${{ mpi }}

tests:
  - script:
      - flux --help

about:
  summary: flux shell plugin to bootstrap openmpi v5+
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/flux-framework/flux-pmix

extra:
  recipe-maintainers:
    - jan-janssen
