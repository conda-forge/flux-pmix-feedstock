schema_version: 1

context:
  name: flux-pmix
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/flux-framework/flux-pmix/releases/download/v${{ version }}/flux-pmix-${{ version }}.tar.gz
  sha256: 7beeab7fb3b1f9d883cfa4dabdfae02474a6eab775dd58c8d3b1f7124c8aa62f

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - make
    - pkg-config
  host:
    - flux-core
    - ${{ mpi }}
    - jansson
    - libpmix
    - libpmix-devel
    - libxml2
    - libxml2-devel
  run:
    - flux-core
    - ${{ mpi }}

tests:
  - script:
      - flux --help

about:
  summary: flux shell plugin to bootstrap openmpi v5+
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/flux-framework/flux-pmix

extra:
  recipe-maintainers:
    - jan-janssen
